[tox]
envlist =
    pycodestyle
    django{42,50,51}-py{39,310,311,312}

[testenv]
deps =
    coverage
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    pycodestyle: pycodestyle
commands =
    !pycodestyle: coverage run manage.py test
    pycodestyle: pycodestyle markdown_view/

[pycodestyle]
max-line-length = 99
