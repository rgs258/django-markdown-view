name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            toxenv: django52-py310
          - python-version: "3.11"
            toxenv: django52-py311
          - python-version: "3.12"
            toxenv: django52-py312
          - python-version: "3.12"
            toxenv: django60-py312
          - python-version: "3.13"
            toxenv: django52-py313
          - python-version: "3.13"
            toxenv: django60-py313
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: pip install tox

      - name: Run tests (${{ matrix.toxenv }})
        run: tox -e ${{ matrix.toxenv }}

  lint:
    name: pycodestyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: pip install tox

      - name: Run pycodestyle
        run: tox -e pycodestyle

  coveralls:
    name: Upload coverage to Coveralls
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install coverage coveralls Django markdown

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Upload coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github
